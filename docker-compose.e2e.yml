# Overlay over docker-compose.yml + compose.auth-test.yml. No host ports.
# Loopback origin stays valid under S-001: browser shares only the client's network namespace.
# Voice and OCR share a private double with no host ports and fictitious keys.
services:
  server:
    environment:
      APP_PUBLIC_URL: http://localhost
      # Explicit opt-in (ADR 0003): Swagger UI and document under /api/docs/ for swagger.spec.ts.
      STARTER_API_DOCS_ENABLED: "true"
      # E2E overlay: enable voice with fictitious key and test provider (S-105 v2).
      DEVNOTES_VOICE_ENABLED: "true"
      GROQ_API_KEY: "fictitious-e2e-voice-key"
      DEVNOTES_VOICE_TEST_PROVIDER: "true"
      DEVNOTES_OCR_ENABLED: "true"
      DEVNOTES_OCR_ALLOWED_SPACES: "work,personal"
      OCR_SPACE_API_KEY: "fictitious-e2e-ocr-key"
      DEVNOTES_AI_ENABLED: "true"
      DEVNOTES_AI_TEST_PROVIDER: "true"
      DEVNOTES_AI_GROQ_ENABLED: "true"
      DEVNOTES_AI_GROQ_EXCERPT_SCOPES: "work/daily,work/free"
      DEVNOTES_AI_WORKERS_ENABLED: "true"
      DEVNOTES_AI_WORKERS_EXCERPT_SCOPES: "work/daily,work/free"
      DEVNOTES_AI_GEMINI_ENABLED: "true"
      DEVNOTES_AI_GEMINI_EXCERPT_SCOPES: "work/daily,work/free"
      DEVNOTES_AI_OPENROUTER_ENABLED: "true"
      DEVNOTES_AI_OPENROUTER_EXCERPT_SCOPES: "work/daily,work/free"
      GROQ_AI_API_KEY: "fictitious-e2e-groq-text-key"
      CLOUDFLARE_ACCOUNT_ID: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      CLOUDFLARE_API_TOKEN: "fictitious-e2e-workers-key"
      GEMINI_API_KEY: "fictitious-e2e-gemini-key"
      OPENROUTER_API_KEY: "fictitious-e2e-openrouter-key"
  client:
    ports: !reset []
    environment:
      APP_PUBLIC_URL: http://localhost
  oidc:
    ports: !reset []
    volumes: !override
      - ${STARTER_E2E_ARTIFACTS:?script supplies a fresh directory}/control/oidc.json:/config/oidc.json:ro
  voice-provider:
    profiles: ["e2e"]
    image: node:24.21.0-alpine
    # No host ports — server reaches it via Docker network only.
    command: ["node", "/app/voice-provider.mjs"]
    volumes:
      - ./e2e/fixtures/voice-provider.mjs:/app/voice-provider.mjs:ro
      - ./e2e/fixtures/ai-provider.mjs:/app/ai-provider.mjs:ro
      - ./e2e/fixtures/ocr:/app/ocr:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8091/healthz"]
      interval: 2s
      timeout: 1s
      retries: 10
      start_period: 2s
  e2e:
    profiles: ["e2e"]
    build:
      context: ./e2e
    init: true
    shm_size: 1gb
    network_mode: service:client
    environment:
      LOCAL_OIDC_PORT: "8090"
    volumes:
      - ${STARTER_E2E_ARTIFACTS:?script supplies a fresh directory}:/artifacts
    depends_on:
      client:
        condition: service_healthy
      voice-provider:
        condition: service_healthy
