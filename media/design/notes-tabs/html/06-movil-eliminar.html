<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Móvil · Confirmar eliminación</title>
<style>
body{margin:0;background:#181a1b}
button{font:inherit;cursor:pointer}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; display: flex; align-items: center; justify-content: center; background: #0d0e0f; color: #e1e3e6; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overflow: hidden;">
  <section role="alertdialog" aria-labelledby="del-title" aria-describedby="del-desc" style="width: 334px; display: flex; flex-direction: column; gap: 14px; padding: 22px 20px 16px; background: #26292b; border: 1px solid #3d4248; border-radius: 14px; box-shadow: 0 18px 40px rgba(0,0,0,0.55);">
    <div style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #3a2422; color: #ff8a80;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
    </div>
    <h2 id="del-title" style="margin: 0; font-size: 19px; font-weight: 700;">¿Eliminar «Diario»?</h2>
    <p id="del-desc" style="margin: 0; font-size: 14px; line-height: 21px; color: #c9ced4;">Se borran la nota y sus 4 versiones del historial. No se puede deshacer.</p>
    <p style="margin: 0; font-size: 13px; line-height: 19px; color: #a6adb7;">Si solo querés sacarla de la vista, cerrá su pestaña: la nota sigue guardada.</p>
    <div style="display: flex; gap: 10px; justify-content: flex-end; padding-top: 6px;">
      <button style="height: 44px; padding: 0 18px; border: 1px solid #4a5058; border-radius: 8px; background: transparent; color: #e1e3e6; font-size: 14px;">Cancelar</button>
      <button style="height: 44px; padding: 0 18px; border: 0; border-radius: 8px; background: #ff8a80; color: #2b0d0a; font-size: 14px; font-weight: 700;">Eliminar</button>
    </div>
  </section>
</div>
</body>
</html>
