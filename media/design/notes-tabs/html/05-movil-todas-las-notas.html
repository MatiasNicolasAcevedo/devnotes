<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Móvil · Todas las notas</title>
<style>
body{margin:0;background:#181a1b}
button{font:inherit;cursor:pointer}
.nr{display:grid;grid-template-columns:10px minmax(0,1fr) auto 44px;align-items:center;gap:10px;min-height:56px;padding:0 4px 0 14px;border-bottom:1px solid #2c2f33}
.dot{width:8px;height:8px;border-radius:50%;background:#8ab4f8}
.more{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;background:transparent;color:#a6adb7}
.act{display:flex;align-items:center;gap:14px;width:100%;height:48px;padding:0 16px;border:0;background:transparent;color:#e1e3e6;font-size:14px;text-align:left}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; display: flex; flex-direction: column; background: #181a1b; color: #e1e3e6; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overflow: hidden;">

  <div aria-hidden="true" style="flex: 1; background: #0d0e0f; opacity: 0.85; display: flex; flex-direction: column;">
    <div style="height: 48px; background: #212324;"></div>
    <div style="height: 44px; background: #131516;"></div>
  </div>

  <section role="dialog" aria-label="Todas las notas" style="position: absolute; left: 0; right: 0; bottom: 0; height: 720px; display: flex; flex-direction: column; background: #212324; border-radius: 16px 16px 0 0; border-top: 1px solid #3d4248;">
    <div style="display: flex; justify-content: center; padding: 8px 0 4px;"><span style="width: 40px; height: 4px; border-radius: 2px; background: #5a6068;"></span></div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 4px 8px 8px 16px;">
      <h2 style="flex: 1; margin: 0; font-size: 18px; font-weight: 700;">Notas · Trabajo</h2>
      <button aria-label="Cerrar" class="more"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div style="display: flex; gap: 8px; padding: 0 16px 12px;">
      <label style="flex: 1; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; background: #131516; border: 1px solid #393d42; border-radius: 8px; color: #7d848e;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input aria-label="Buscar nota" placeholder="Buscar nota" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #e1e3e6; font-size: 15px;">
      </label>
      <button style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 14px; border: 0; border-radius: 8px; background: #8ab4f8; color: #10213d; font-size: 14px; font-weight: 700;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nueva
      </button>
    </div>

    <div style="flex: 1; overflow: hidden; border-top: 1px solid #2c2f33;">
      <div class="nr"><span class="dot"></span><span style="font-size: 15px; font-weight: 600;">Comandos</span><span style="font-size: 12px; color: #a6adb7;">abierta</span><button class="more" aria-label="Acciones de Comandos"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button></div>
      <div class="nr"><span class="dot"></span><span style="font-size: 15px;">Tareas</span><span style="font-size: 12px; color: #a6adb7;">abierta</span><button class="more" aria-label="Acciones de Tareas"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button></div>
      <div class="nr" style="background: #2a2e32; border-bottom: 0;"><span></span><span style="font-size: 15px;">Diario</span><span style="font-size: 12px; color: #a6adb7;">ayer</span><button class="more" aria-label="Acciones de Diario" aria-expanded="true" style="color: #ffffff;"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button></div>
      <div role="menu" aria-label="Acciones de Diario" style="background: #2a2e32; border-bottom: 1px solid #2c2f33; padding-bottom: 6px;">
        <button class="act" role="menuitem"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg>Abrir en pestaña</button>
        <button class="act" role="menuitem"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Renombrar</button>
        <button class="act" role="menuitem"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>Ver versiones</button>
        <a href="06-movil-eliminar.html" class="act" role="menuitem" style="color: #ff8a80; text-decoration: none;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Eliminar definitivamente…</a>
      </div>
      <div class="nr"><span class="dot"></span><span style="font-size: 15px;">Borrador</span><span style="font-size: 12px; color: #a6adb7;">abierta</span><button class="more" aria-label="Acciones de Borrador"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button></div>
      <div class="nr"><span></span><span style="font-size: 15px;">Usuarios de prueba</span><span style="font-size: 12px; color: #a6adb7;">22 nov</span><button class="more" aria-label="Acciones de Usuarios de prueba"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button></div>
      <div class="nr"><span></span><span style="font-size: 15px;">Ideas de refactor</span><span style="font-size: 12px; color: #a6adb7;">18 nov</span><button class="more" aria-label="Acciones de Ideas de refactor"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button></div>
    </div>
    <p style="margin: 0; padding: 12px 16px 18px; font-size: 12px; color: #a6adb7; line-height: 17px; border-top: 1px solid #2c2f33;">Tocar una nota la abre en una pestaña. Cerrar una pestaña no borra la nota.</p>
  </section>
</div>
</body>
</html>
