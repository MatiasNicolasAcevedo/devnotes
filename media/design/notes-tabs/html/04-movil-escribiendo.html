<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Móvil · Escribiendo con teclado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#181a1b}
button{font:inherit;cursor:pointer}
.ln{display:grid;grid-template-columns:30px minmax(0,1fr);align-items:start;min-height:22px}
.n{color:#7d848e;text-align:right;padding-right:8px;font-size:11px;line-height:22px}
.tb{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:8px;background:transparent;color:#e1e3e6;font-size:14px;font-weight:600}
.sep{flex:0 0 auto;width:1px;height:24px;background:#393d42;margin:0 2px}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #181a1b; color: #e1e3e6; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overflow: hidden;">

  <div style="display: flex; align-items: center; height: 44px; background: #131516; border-bottom: 1px solid #393d42;">
    <button aria-label="Pestaña anterior" style="width: 44px; height: 44px; border: 0; background: transparent; color: #a6adb7; display: inline-flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
    <div style="flex: 1; min-width: 0; text-align: center; font-size: 14px; font-weight: 600; color: #ffffff;">Comandos <span style="font-weight: 400; color: #7d848e;">· 2 de 4</span></div>
    <button aria-label="Pestaña siguiente" style="width: 44px; height: 44px; border: 0; background: transparent; color: #a6adb7; display: inline-flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
    <button aria-label="Guardar versión" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 34px; margin-right: 6px; border: 0; border-radius: 6px; background: #ffb74d; color: #1b1b1b;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>
    </button>
  </div>

  <main style="flex: 1; min-height: 0; padding: 8px 10px 0 0; font-family: 'Roboto Mono', monospace; font-size: 14px; line-height: 22px; overflow: hidden;">
    <div class="ln"><span class="n">6</span><div style="display: flex; gap: 8px;"><span style="color: #8ab4f8;">•</span><span>Siempre con --grep y --project desktop</span></div></div>
    <div class="ln"><span class="n">7</span><div style="display: flex; gap: 8px;"><span style="color: #8ab4f8;">•</span><span>La suite completa queda diferida</span></div></div>
    <div class="ln"><span class="n">8</span><div style="display: flex; gap: 8px; align-items: center;"><span style="flex: 0 0 auto; width: 16px; height: 16px; border-radius: 3px; background: #8ab4f8;"></span><span style="color: #7d848e; text-decoration: line-through;">Levantar stack local</span></div></div>
    <div class="ln"><span class="n">9</span><div style="display: flex; gap: 8px; align-items: center;"><span style="flex: 0 0 auto; width: 16px; height: 16px; border-radius: 3px; border: 1.5px solid #a6adb7; box-sizing: border-box;"></span><span>Revisar CI del PR</span></div></div>
    <div class="ln" style="background: #1f2224;"><span class="n" style="color: #e1e3e6;">10</span><div style="display: flex; gap: 8px; align-items: center;"><span style="flex: 0 0 auto; width: 16px; height: 16px; border-radius: 3px; border: 1.5px solid #a6adb7; box-sizing: border-box;"></span><span>Pedir revisión<span style="display: inline-block; width: 2px; height: 17px; background: #ffb74d; vertical-align: middle; margin-left: 1px;"></span></span></div></div>
  </main>

  <div role="toolbar" aria-label="Herramientas del editor" style="display: flex; align-items: center; height: 48px; padding: 0 4px; background: #1d1f21; border-top: 1px solid #393d42; overflow: hidden;">
    <button class="tb" aria-label="Casillas" style="background: #2f3a48;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="6" height="6" rx="1"/><path d="M12 7h9M12 17h9"/><rect x="3" y="14" width="6" height="6" rx="1"/></svg></button>
    <button class="tb" aria-label="Viñetas"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg></button>
    <button class="tb" aria-label="Lista numerada"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10M4 5h1v4M4 15h2l-2 3h2"/></svg></button>
    <span class="sep"></span>
    <button class="tb" aria-label="Título 2">H2</button>
    <button class="tb" aria-label="Negrita" style="font-weight: 800;">B</button>
    <button class="tb" aria-label="Bloque de código"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m8 8-4 4 4 4M16 8l4 4-4 4"/></svg></button>
    <button class="tb" aria-label="Enlace"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button>
    <div style="flex: 1;"></div>
    <button class="tb" aria-label="Ocultar teclado"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="11" rx="2"/><path d="M7 8h1M11 8h1M15 8h1M8 12h8M9 18l3 3 3-3"/></svg></button>
  </div>

  <div aria-label="Espacio del teclado del sistema" style="height: 300px; display: flex; align-items: center; justify-content: center; background: repeating-linear-gradient(135deg, #222528 0 10px, #1e2123 10px 20px); color: #7d848e; font-size: 13px; border-top: 1px solid #2c2f33;">Teclado del sistema</div>
</div>
</body>
</html>
