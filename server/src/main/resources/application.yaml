# Configuración común. Valores por entorno llegan por variables (ver .env.example y docs/SETUP.md);
# el datasource lo aportan SPRING_DATASOURCE_* en Compose o @ServiceConnection en pruebas.
spring:
  profiles:
    default: google
  application:
    name: devnotes-server
  datasource:
    hikari:
      # Bound health acquisition/validation and driver I/O inside the 30 s UI outage window.
      connection-timeout: 2000
      validation-timeout: 1000
      data-source-properties:
        connectTimeout: 2
        socketTimeout: 2
  autoconfigure:
    # Sin usuarios en memoria ni contraseña generada en logs: la identidad llega solo por OIDC (base heredada).
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  session:
    jdbc:
      # Schema owned by Flyway (V10); Spring Session only reads/writes rows and purges expired ones every minute.
      initialize-schema: never
  mvc:
    problemdetails:
      enabled: true
    # T-099: the per-request ServletRequestHandledEvent reads the session id (getSession(false)), which loads and
    # extends the stored session even on anonymous routes. Nothing listens to it; only authenticated activity may
    # extend a session (see PersistentSessionConfiguration for the flash-map counterpart).
    publish-request-handled-events: false
  servlet:
    multipart:
      # Voice transcription limits (S-105): 20 MiB file, 21 MiB request, keep in memory.
      max-file-size: 20MB
      max-request-size: 21MB
      file-size-threshold: 21MB

starter:
  name: "DevNotes"
  # Versión del artefacto Maven, filtrada en el build por spring-boot-starter-parent (delimitador @).
  version: "@project.version@"
  api-docs:
    # ADR 0003: OpenAPI/Swagger UI opt-in, solo con APP_PUBLIC_URL HTTP loopback (ApiDocsAccess valida al arrancar).
    # Mapeo explícito: el binding relajado esperaría STARTER_APIDOCS_ENABLED.
    enabled: ${STARTER_API_DOCS_ENABLED:false}

# El mismo interruptor gobierna springdoc y el permiso GET de SecurityConfig; apagado no registra rutas.
springdoc:
  api-docs:
    enabled: ${starter.api-docs.enabled}
    path: /api/docs/openapi
  swagger-ui:
    enabled: ${starter.api-docs.enabled}
    # Raíz de la UI = /api/docs/ (recursos en /api/docs/swagger-ui/**): atraviesa los proxies existentes de /api/.
    path: /api/docs/swagger-ui.html
    supported-submit-methods: get
    persist-authorization: false
    # Sin la URL de ejemplo externa (petstore) en el inicializador: solo llamadas same-origin.
    disable-swagger-default-url: true

server:
  # No host publication in ordinary Compose; nginx/Vite remove incoming forwarding metadata.
  # Direct loopback diagnostics MUST override this to none (compose.diagnostic.yml).
  forward-headers-strategy: framework
  servlet:
    session:
      # T-099: default lifetime of a session that is not (yet) authenticated, i.e. the OIDC correlation between
      # /oauth2/authorization/google and the callback. A valid login raises it to 7 days of inactivity and the
      # security context repository enforces 30 days from that login.
      timeout: 10m
      tracking-modes: cookie
      cookie:
        name: JSESSIONID
        path: /
        http-only: true
        same-site: lax
        # Secure is derived from validated APP_PUBLIC_URL by OidcConfiguration.
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        readiness:
          include: readinessState,db

# Health status remains observable without publishing driver causes, SQL or database coordinates in outage logs.
logging:
  level:
    org.springframework.boot.jdbc.health.DataSourceHealthIndicator: ERROR
    com.zaxxer.hikari.pool.PoolBase: ERROR
    com.zaxxer.hikari.pool.ProxyConnection: ERROR

# Voice — disabled by default; activation requires explicit configuration (S-105).
devnotes:
  ai:
    enabled: ${DEVNOTES_AI_ENABLED:false}
    pilot-id: ${DEVNOTES_AI_PILOT_ID:}
    test-provider: ${DEVNOTES_AI_TEST_PROVIDER:false}
    providers:
      groq:
        enabled: ${DEVNOTES_AI_GROQ_ENABLED:false}
        key: ${GROQ_AI_API_KEY:}
        excerpt-scopes: ${DEVNOTES_AI_GROQ_EXCERPT_SCOPES:}
      workers:
        enabled: ${DEVNOTES_AI_WORKERS_ENABLED:false}
        key: ${CLOUDFLARE_API_TOKEN:}
        account-id: ${CLOUDFLARE_ACCOUNT_ID:}
        excerpt-scopes: ${DEVNOTES_AI_WORKERS_EXCERPT_SCOPES:}
      gemini:
        enabled: ${DEVNOTES_AI_GEMINI_ENABLED:false}
        key: ${GEMINI_API_KEY:}
        excerpt-scopes: ${DEVNOTES_AI_GEMINI_EXCERPT_SCOPES:}
      openrouter:
        enabled: ${DEVNOTES_AI_OPENROUTER_ENABLED:false}
        key: ${OPENROUTER_API_KEY:}
        excerpt-scopes: ${DEVNOTES_AI_OPENROUTER_EXCERPT_SCOPES:}
  voice:
    enabled: ${DEVNOTES_VOICE_ENABLED:false}
    api-key: ${GROQ_API_KEY:}
    test-provider: ${DEVNOTES_VOICE_TEST_PROVIDER:false}
    test-provider-url: ${DEVNOTES_VOICE_TEST_PROVIDER_URL:}
  ocr:
    enabled: ${DEVNOTES_OCR_ENABLED:false}
    allowed-spaces: ${DEVNOTES_OCR_ALLOWED_SPACES:}
    api-key: ${OCR_SPACE_API_KEY:}
  # Service activity window (S-111) — off by default; the operator fixes the single allowed owner UUID.
  keep-awake:
    enabled: ${DEVNOTES_KEEP_AWAKE_ENABLED:false}
    owner-id: ${DEVNOTES_KEEP_AWAKE_OWNER_ID:}
